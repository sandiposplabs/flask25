name: Flask API CI/CD to Azure Container Apps

on:
push:
branches:
- main

env:
IMAGE_NAME: flask-api

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
  # 1. Checkout code
  - name: Checkout code
    uses: actions/checkout@v4

  # 2. Login to Azure
  - name: Azure Login
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  # 3. Login to Azure Container Registry (ACR)
  - name: Docker Login to ACR
    run: |
      echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

  # 4. Build Docker image
  - name: Build Docker Image
    run: |
      docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest ./flask-api

  # 5. Push Docker image to ACR
  - name: Push Docker Image
    run: |
      docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # 6. Deploy to Azure Container Apps
  - name: Deploy to Azure Container Apps
    run: |
      az containerapp update \
        --name ${{ secrets.CONTAINER_APP }} \
        --resource-group ${{ secrets.RESOURCE_GROUP }} \
        --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # 7. Show deployment URL (optional)
  - name: Get App URL
    run: |
      az containerapp show \
        --name ${{ secrets.CONTAINER_APP }} \
        --resource-group ${{ secrets.RESOURCE_GROUP }} \
        --query properties.configuration.ingress.fqdn \
        -o tsv
```
