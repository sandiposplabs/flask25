name: Test Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t test-image ./flask-api

      - name: Run Container
        run: |
          docker run -d -p 5000:5000 test-image
          sleep 5
          curl http://localhost:5000
