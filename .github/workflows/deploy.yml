name: Flask API CI/CD to Azure Container Apps

on:
push:
branches:
- main

env:
IMAGE_NAME: flask-api

jobs:
build-and-deploy:
runs-on: ubuntu-latest

```
steps:
- name: Checkout code
  uses: actions/checkout@v4

- name: Azure Login
  uses: azure/login@v2
  with:
    client-id: ${{ secrets.AZURE_CLIENT_ID }}
    tenant-id: ${{ secrets.AZURE_TENANT_ID }}
    subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

- name: Docker Login to ACR
  run: |
    echo ${{ secrets.ACR_PASSWORD }} | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

- name: Build Docker Image
  run: |
    docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest ./flask-api

- name: Push Docker Image
  run: |
    docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

- name: Deploy to Azure Container Apps
  run: |
    az containerapp update \
      --name ${{ secrets.CONTAINER_APP }} \
      --resource-group ${{ secrets.RESOURCE_GROUP }} \
      --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
```
